name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7              # CHECK: latest major

      - name: Configure Pages
        uses: actions/configure-pages@v6       # CHECK: latest major

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5 # CHECK: latest major
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5          # CHECK: latest major

      - name: Print the URL 
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"